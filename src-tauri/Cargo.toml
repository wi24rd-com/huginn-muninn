[package]
name = "huginn-muninn"
version = "1.0.0"
description = "Wi24rd Huginn and Muninn — for Cloudflare®"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "huginn_muninn_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
regex = "1"
futures-util = "0.3"
# Allerede i træet via tauri (sync) og reqwest (time); her direkte til begrænseren og hentekøen.
tokio = { version = "1.54.1", features = ["time", "sync"] }

# Kun desktop: én instans (skal registreres som det første plugin), start ved login og lokale notifikationer.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }
